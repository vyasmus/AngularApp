AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap stack for AngularApp PROD CI/CD.
  Creates the CodePipeline artifact bucket, CodeBuild projects/roles,
  CloudFormation execution role, GitHub CodeConnections source, and pipeline.
  This stack is intentionally separate from the runtime infrastructure stack.

Parameters:
  ApplicationName:
    Type: String
    Default: AngularApp
    AllowedPattern: '^[A-Za-z0-9-]+$'

  EnvironmentName:
    Type: String
    Default: PROD
    AllowedValues: [PROD]

  GitHubConnectionArn:
    Type: String
    Default: arn:aws:codeconnections:us-east-1:063378366502:connection/d4427e74-68c5-434a-9852-ceefc9ed1ebc
    Description: Existing AWS CodeConnections GitHub connection ARN.

  GitHubRepository:
    Type: String
    Default: vyasmus/AngularApp
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

  GitHubBranch:
    Type: String
    Default: main

  NodeVersion:
    Type: String
    Default: '22'
    AllowedValues: ['22']

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

  WebsiteBucketName:
    Type: String
    Description: Globally unique lowercase S3 bucket name for the PROD website.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'

  ApprovalEmail:
    Type: String
    Default: 'vyamus@gmail.com'

  EnableApprovals:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  ApprovalEnabled: !Equals [ !Ref EnableApprovals, 'true' ]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: CodePipelineArtifacts

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-${EnvironmentName}-CloudFormationExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageAngularRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3BucketManagement
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${WebsiteBucketName}'
              - Sid: CloudFrontManagement
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                Resource: '*'
              - Sid: CloudWatchLogsManagement
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/*'
              - Sid: PassOnlyApplicationRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationName}-${EnvironmentName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - cloudfront.amazonaws.com
                      - cloudformation.amazonaws.com

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${ApplicationName}-${EnvironmentName}-build'
      RetentionInDays: 90

  DeployLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${ApplicationName}-${EnvironmentName}-deploy'
      RetentionInDays: 90

  CodeBuildBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-${EnvironmentName}-CodeBuildBuildRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildLogsAndArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub '${BuildLogGroup.Arn}:*'
              - Sid: ArtifactBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ReadInputArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Sid: WriteBuildArtifact
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${ArtifactBucket.Arn}/*'

  CodeBuildDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-${EnvironmentName}-CodeBuildDeployRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeployAngular
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeployLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub '${DeployLogGroup.Arn}:*'
              - Sid: ArtifactBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ReadBuildArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Sid: DiscoverRuntimeStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationName}-${EnvironmentName}-runtime/*'
              - Sid: WriteWebsiteBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationName}-*'
              - Sid: WriteWebsiteObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${WebsiteBucketName}/*'
              - Sid: InvalidateCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: '*'

  AngularBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ApplicationName}-${EnvironmentName}-Build'
      ServiceRole: !GetAtt CodeBuildBuildRole.Arn
      TimeoutInMinutes: 30
      Source:
        Type: CODEPIPELINE
        BuildSpec: ./buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: NODE_VERSION
            Value: !Ref NodeVersion
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
          StreamName: build

  AngularDeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ApplicationName}-${EnvironmentName}-Deploy'
      ServiceRole: !GetAtt CodeBuildDeployRole.Arn
      TimeoutInMinutes: 20
      Source:
        Type: CODEPIPELINE
        ##BuildSpec: deployspec.yml
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: RUNTIME_STACK_NAME
            Value: !Sub '${ApplicationName}-${EnvironmentName}-runtime'
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref DeployLogGroup
          StreamName: deploy

  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ApplicationName}-${EnvironmentName}-approval'

  ApprovalSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ApprovalTopic
      Protocol: email
      Endpoint: !Ref ApprovalEmail

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-${EnvironmentName}-CodePipelineRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineOperations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GitHubConnection
                Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Sid: StartBuilds
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt AngularBuildProject.Arn
                  - !GetAtt AngularDeployProject.Arn
              - Sid: PassBuildRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt CodeBuildBuildRole.Arn
                  - !GetAtt CodeBuildDeployRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: codebuild.amazonaws.com
              - Sid: ManageRuntimeStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationName}-${EnvironmentName}-runtime/*'
              - Sid: UseCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: ApprovalNotification
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref ApprovalTopic

  AngularPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ApplicationName}-${EnvironmentName}-Pipeline'
      RoleArn: !GetAtt CodePipelineRole.Arn
      RestartExecutionOnUpdate: true
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Infrastructure
          Actions:
            - Name: DeployRuntimeStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ApplicationName}-${EnvironmentName}-runtime'
                Capabilities: CAPABILITY_NAMED_IAM
                TemplatePath: SourceArtifact::infrastructure/cloudformation/angular-app.yaml
                RoleArn: !GetAtt CloudFormationExecutionRole.Arn
                ParameterOverrides: !Sub |
                  {
                    "ApplicationName": "${ApplicationName}",
                    "EnvironmentName": "${EnvironmentName}",
                    "CloudFrontPriceClass": "${CloudFrontPriceClass}",
                    "BucketName": "${WebsiteBucketName}"
                  }
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: AngularBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref AngularBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        - Name: ProductionApproval
          Actions:
            - Name: Approve
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: !Sub 'Approve ${ApplicationName} ${EnvironmentName} deployment.'
                NotificationArn: !If [ApprovalEnabled, !Ref ApprovalTopic, !Ref AWS::NoValue]
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: DeployAngularToS3
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref AngularDeployProject
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

Outputs:
  PipelineName:
    Value: !Ref AngularPipeline
  PipelineArn:
    Value: !GetAtt AngularPipeline.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  RuntimeStackName:
    Value: !Sub '${ApplicationName}-${EnvironmentName}-runtime'

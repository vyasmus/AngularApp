version: 0.2

phases:

  install:
    commands:
      - set -eu
      - aws --version

  pre_build:
    commands:
      - echo "Discovering runtime stack outputs..."
      - |
        set -eu

        WEBSITE_BUCKET="$(aws cloudformation describe-stacks \
          --stack-name "${RUNTIME_STACK_NAME}" \
          --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue | [0]" \
          --output text)"

        CLOUDFRONT_DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
          --stack-name "${RUNTIME_STACK_NAME}" \
          --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue | [0]" \
          --output text)"

        test -n "${WEBSITE_BUCKET}"
        test -n "${CLOUDFRONT_DISTRIBUTION_ID}"

        echo "Website bucket: ${WEBSITE_BUCKET}"
        echo "CloudFront distribution: ${CLOUDFRONT_DISTRIBUTION_ID}"

        printf 'WEBSITE_BUCKET=%s\n' "${WEBSITE_BUCKET}" > /tmp/deployment.env
        printf 'CLOUDFRONT_DISTRIBUTION_ID=%s\n' "${CLOUDFRONT_DISTRIBUTION_ID}" >> /tmp/deployment.env

  build:
    commands:
      - echo "Loading deployment variables..."
      - . /tmp/deployment.env
      - echo "Deploying Angular application to S3..."
      - test -f index.html
      - |
        set -eu

        aws s3 sync . "s3://${WEBSITE_BUCKET}" \
          --delete \
          --exclude "deployspec.yml" \
          --cache-control "public,max-age=31536000,immutable"

      - echo "Uploading index.html with no-cache headers..."
      - |
        set -eu

        aws s3 cp "s3://${WEBSITE_BUCKET}/index.html" \
          "s3://${WEBSITE_BUCKET}/index.html" \
          --metadata-directive REPLACE \
          --content-type "text/html; charset=utf-8" \
          --cache-control "no-cache,no-store,must-revalidate"

      - echo "Invalidating CloudFront..."
      - |
        set -eu

        INVALIDATION_ID="$(aws cloudfront create-invalidation \
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
          --paths '/*' \
          --query 'Invalidation.Id' \
          --output text)"

        echo "Created CloudFront invalidation: ${INVALIDATION_ID}"

  post_build:
    commands:
      - echo "PROD deployment completed successfully."

version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      - npm --version
      - npm ci

  pre_build:
    commands:
      - npm test -- --watch=false --no-progress

  build:
    commands:
      - npm run build -- --configuration production

  post_build:
    commands:
      - echo "Angular build output:"
      - find dist -maxdepth 3 -type f | sort | head -200

artifacts:
  base-directory: dist/AngularApp/browser
  files:
    - '**/*'

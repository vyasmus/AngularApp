version: 0.2

env:
  variables:
    NODE_ENV: production

phases:

  install:
    commands:
      - echo "Installing dependencies..."
      - node --version
      - npm --version
      - npm install -g @angular/cli@latest
      - npm ci

  pre_build:
    commands:
      - echo "Running Angular tests..."
      - npm test -- --watch=false --no-progress

  build:
    commands:
      - echo "Building Angular application..."
      - npm run build -- --configuration production

  post_build:
    commands:
      - echo "Angular build output:"
      - find dist -maxdepth 4 -type f | sort
      - test -d dist/AngularApp/browser
      - test -f dist/AngularApp/browser/index.html
      - echo "Angular browser artifact validated successfully."

artifacts:
  base-directory: dist/AngularApp/browser
  files:
    - '**/*'
  discard-paths: no

cache:
  paths:
    - node_modules/**/*

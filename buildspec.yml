version: 0.2

env:
  variables:
    NODE_ENV: production

phases:

  install:
    runtime-versions:
      nodejs: 24
    commands:
      - echo "Installing Packages ..."
      - node --version
      - npm --version
      - echo "Installing angular cli ..."
      - npm install -g @angular/cli@latest
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Running Angular tests..."
      - npx ng test --watch=false --no-progress

  build:
    commands:
      - echo "Building Angular application..."
      - export NODE_OPTIONS="--max-old-space-size=4096"
      - npx ng build -- --configuration=production --verbose

  post_build:
    commands:
      - echo "Angular build output:"
      - find dist -maxdepth 4 -type f | sort
      - test -d dist/AngularApp/browser
      - test -f dist/AngularApp/browser/index.html
      - echo "Angular browser artifact validated successfully."

artifacts:
  base-directory: dist/AngularApp/browser
  files:
    - '**/*'
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
